<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Payrail · Offline</title>
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #f2f2f2; text-align: center; padding: 0 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 360px; }
    img { width: 64px; height: auto; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: #a8a8a8; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #f2f2f2; color: #0a0a0a; border: 0; border-radius: 999px;
      padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="" />
    <h1>You're offline</h1>
    <p>Invoice status and payments need a connection. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
